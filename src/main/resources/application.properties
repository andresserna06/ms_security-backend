spring.application.name=security_ms
server.port=8181

spring.config.import=optional:file:.env[.properties],optional:file:Backend/ms_security/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/security_ms_project_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
security.jwt.secret=${JWT_SECRET:clave-local-educativa-de-32-bytes}

